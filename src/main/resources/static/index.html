<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; vertical-align: middle; }
        input, select, button { padding: 6px; margin: 4px 0; }
        .controls { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .add-form { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .add-form input, .add-form button { flex: 1 1 auto; }

        /* Highlights */
        .out-stock { background-color: #f8d7da; }
        .low-stock { background-color: #fff3cd; }
        .expiring-soon { background-color: #ffe5b4; }
        .expired { background-color: #f5c6cb; }

        /* Barcode Modal */
        #barcodeModal { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999; }
        #barcodeModal img { max-width: 400px; max-height: 200px; background: white; padding: 20px; border-radius: 4px; }
        .product-image { max-width: 50px; max-height: 50px; object-fit: cover; }
    </style>
</head>
<body>

<h1>Inventory Dashboard</h1>

<!-- Add / Update Product Form -->
<div class="add-form">
    <h3 id="formTitle" style="flex-basis:100%;">Add Product</h3>
    <input type="text" id="addName" placeholder="Name">
    <input type="file" id="addImage" accept="image/*">
    <input type="text" id="addSku" placeholder="SKU">
    <input type="number" id="addBuyingPrice" placeholder="Buying Price" step="0.01">
    <input type="number" id="addSellingPrice" placeholder="Selling Price" step="0.01">
    <input type="number" id="addQuantity" placeholder="Quantity">
    <input type="date" id="addExpirationDate" placeholder="Expiration Date">
    <button onclick="addOrUpdateProduct()" id="addUpdateBtn">Add Product</button>
</div>

<!-- Controls -->
<div class="controls">
    <input type="text" id="searchName" placeholder="Search by name">
    <select id="searchAvailability">
        <option value="">All</option>
        <option value="true">Available</option>
        <option value="false">Out of Stock</option>
    </select>
    <select id="sortOption">
        <option value="">Sort By</option>
        <option value="low-cost">Low Cost</option>
        <option value="high-cost">High Cost</option>
        <option value="low-profit">Low Profit</option>
        <option value="high-profit">High Profit</option>
        <option value="date-asc">Expiration ↑</option>
        <option value="date-desc">Expiration ↓</option>
        <option value="qty-asc">Quantity ↑</option>
        <option value="qty-desc">Quantity ↓</option>
        <option value="newest">Newest Listed</option>
    </select>
    <select id="expirationFilter">
        <option value="">All Expiration</option>
        <option value="expiring-soon">Expiring Soon (≤7 days)</option>
        <option value="expired">Expired</option>
    </select>
    <button onclick="search(0)">Apply</button>
    <button onclick="resetFilters()">Reset</button>
    <button onclick="exportExcel()">Export Excel</button>
    <button onclick="exportPdf()">Export PDF</button>
    <button onclick="exportWord()">Export Word</button>
</div>

<!-- Products Table -->
<table id="productTableElement">
    <thead>
    <tr>
        <th>#</th>
        <th>Image</th>
        <th>Name</th>
        <th>SKU</th>
        <th>Buying Price</th>
        <th>Selling Price</th>
        <th>Quantity</th>
        <th>Profit</th>
        <th>Available</th>
        <th>Expiration Date</th>
        <th>Barcode</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
</table>

<!-- Pagination -->
<div class="pagination">
    <button onclick="prevPage()">Prev</button>
    <span id="pageInfo"></span>
    <button onclick="nextPage()">Next</button>
</div>

<!-- Barcode Modal -->
<div id="barcodeModal" onclick="closeBarcodeModal()">
    <img id="barcodeModalImg" src="">
</div>

<script>
    const API = "/api/products";
    let editingId = null;
    let currentPage = 0;
    let totalPages = 1;
    const pageSize = 10;

    // Fetch and display products
    async function search(page = 0, size = pageSize) {
        const name = document.getElementById('searchName').value;
        const available = document.getElementById('searchAvailability').value;
        let sortOption = document.getElementById('sortOption').value;
        const expirationFilter = document.getElementById('expirationFilter').value;

        let url = `${API}/search?page=${page}&size=${size}`;
        if(name) url += `&name=${encodeURIComponent(name)}`;
        if(available) url += `&available=${available}`;
        if(expirationFilter) url += `&expirationFilter=${expirationFilter}`;

        // Default to newest if no sort selected
        if(!sortOption) sortOption = 'newest';
        if(sortOption && sortOption !== 'newest') url += `&sort=${sortOption}`;

        const res = await fetch(url);
        const data = await res.json();
        let products = [];
        if(Array.isArray(data)) {
            products = data; totalPages = 1; currentPage = 0;
        } else if(data.products) {
            products = data.products; totalPages = data.totalPages; currentPage = data.currentPage;
        }

        // Sort newest first if selected
        if(sortOption === 'newest'){
            products.sort((a,b)=>{
                if(a.createdAt && b.createdAt) return new Date(b.createdAt) - new Date(a.createdAt);
                return b.id.localeCompare(a.id); // fallback if no createdAt
            });
        }

        displayProducts(products);
        document.getElementById('pageInfo').innerText = `Page ${currentPage + 1} of ${totalPages}`;
    }

    function displayProducts(products){
        const tbody = document.getElementById("productTableBody");
        tbody.innerHTML = "";
        const today = new Date();

        products.forEach((p, idx)=>{
            const tr = document.createElement("tr");
            tr.setAttribute("data-id", p.id);

            if(!p.available) tr.classList.add("out-stock");
            else if(p.quantity <= 5) tr.classList.add("low-stock");

            if(p.expirationDate){
                const expDate = new Date(p.expirationDate);
                const diffDays = (expDate - today) / (1000*60*60*24);
                if(diffDays < 0) tr.classList.add("expired");
                else if(diffDays <= 7) tr.classList.add("expiring-soon");
            }

            const sn = currentPage * pageSize + idx + 1;
            tr.innerHTML = `
            <td>${sn}</td>
            <td>${p.image ? `<img src="${p.image}" class="product-image">` : ""}</td>
            <td>${p.name}</td>
            <td>${p.sku || ""}</td>
            <td>${p.buyingPrice.toFixed(2)}</td>
            <td>${p.sellingPrice.toFixed(2)}</td>
            <td>${p.quantity}</td>
            <td>${(p.sellingPrice - p.buyingPrice).toFixed(2)}</td>
            <td>${p.available}</td>
            <td>${p.expirationDate || ""}</td>
            <td>${p.barcodeImage ? `<img src="data:image/png;base64,${p.barcodeImage}" style="width:80px; cursor:pointer;" onclick="showBarcode('${p.barcodeImage}')">` : "No Barcode"}</td>
            <td>
                <button onclick="editProduct('${p.id}')">Edit</button>
                <button onclick="deleteProduct('${p.id}')">Delete</button>
                <button onclick="openImageUploadRow('${p.id}')">Manage Image</button>
            </td>
        `;
            tbody.appendChild(tr);
        });
    }

    function showBarcode(base64){
        document.getElementById('barcodeModalImg').src = `data:image/png;base64,${base64}`;
        document.getElementById('barcodeModal').style.display = "flex";
    }
    function closeBarcodeModal(){ document.getElementById('barcodeModal').style.display = "none"; }

    async function addOrUpdateProduct(){
        const name = document.getElementById('addName').value.trim();
        const sku = document.getElementById('addSku').value.trim();
        const buyingPrice = parseFloat(document.getElementById('addBuyingPrice').value);
        const sellingPrice = parseFloat(document.getElementById('addSellingPrice').value);
        const quantity = parseInt(document.getElementById('addQuantity').value);
        const expirationDate = document.getElementById('addExpirationDate').value;

        if(!name || isNaN(buyingPrice) || isNaN(sellingPrice) || isNaN(quantity)){
            alert("Please fill all required fields.");
            return;
        }

        const fileInput = document.getElementById('addImage');
        let base64Image = null;
        if(fileInput.files && fileInput.files[0]){
            base64Image = await fileToBase64(fileInput.files[0]);
        }

        const product = { name, sku, buyingPrice, sellingPrice, quantity, expirationDate, image: base64Image };
        let res;
        if(editingId){
            res = await fetch(`${API}/${editingId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(product) });
        } else {
            res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(product) });
        }

        if(res.ok){
            alert(editingId ? "Product updated!" : "Product added!");
            resetForm();
            search(currentPage);
        } else {
            const errorText = await res.text();
            alert("Error saving product:\n" + errorText);
        }
    }

    function fileToBase64(file){
        return new Promise((resolve, reject)=>{
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = ()=>resolve(reader.result);
            reader.onerror = error=>reject(error);
        });
    }

    function openImageUploadRow(productId){
        window.open(`image-upload.html?productId=${productId}`, "_blank");
    }

    function editProduct(id){
        editingId = id;
        const row = [...document.getElementById('productTableBody').children].find(r=>r.dataset.id===id);
        if(!row) return;
        document.getElementById('addName').value = row.cells[2].innerText;
        document.getElementById('addSku').value = row.cells[3].innerText;
        document.getElementById('addBuyingPrice').value = row.cells[4].innerText;
        document.getElementById('addSellingPrice').value = row.cells[5].innerText;
        document.getElementById('addQuantity').value = row.cells[6].innerText;
        document.getElementById('addExpirationDate').value = row.cells[9].innerText;

        document.getElementById('addUpdateBtn').innerText = "Update Product";
        document.getElementById('formTitle').innerText = "Update Product";
    }

    async function deleteProduct(id){
        if(!confirm("Are you sure you want to delete this product?")) return;
        await fetch(`${API}/${id}`, { method:"DELETE" });
        search(currentPage);
    }

    function resetForm(){
        editingId = null;
        document.getElementById('addUpdateBtn').innerText = "Add Product";
        document.getElementById('formTitle').innerText = "Add Product";
        document.querySelectorAll('.add-form input').forEach(i => i.value = "");
    }

    function resetFilters(){
        document.getElementById('searchName').value = "";
        document.getElementById('searchAvailability').value = "";
        document.getElementById('sortOption').value = "";
        document.getElementById('expirationFilter').value = "";
        search(0);
    }

    function prevPage(){ if(currentPage > 0) search(currentPage-1); }
    function nextPage(){ if(currentPage < totalPages-1) search(currentPage+1); }

    function exportExcel() { window.open(`${API}/export/excel?page=${currentPage}&size=${pageSize}`, "_blank"); }
    function exportPdf() { window.open(`${API}/export/pdf?page=${currentPage}&size=${pageSize}`, "_blank"); }
    function exportWord() { window.open(`${API}/export/word?page=${currentPage}&size=${pageSize}`, "_blank"); }

    // Load newest products on page load
    document.addEventListener("DOMContentLoaded", ()=> search(0));
</script>

</body>
</html>
